const gl = canvas.getContext('webgl', {premultipliedAlpha:false, antialias:true});

const vs = `attribute vec2 p; varying vec2 uv;
void main(){ uv = p*0.5+0.5; uv.y = 1.0-uv.y; gl_Position = vec4(p,0.0,1.0); }`;

const fs = `precision highp float;
varying vec2 uv;
uniform sampler2D t1, t2;
uniform vec2 uCenter;   // 현재 당겨진 볼 위치
uniform vec2 uDrag;     // 당긴 벡터
uniform float uFall;
uniform float uMix;
vec3 over(vec4 c){ return mix(vec3(1.0), c.rgb, c.a); }
void main(){
  vec2 d = uv - uCenter;
  float r2 = dot(d,d) / (uFall*uFall);
  float f = r2 < 1.0 ? (1.0-r2)*(1.0-r2) : 0.0;   // 부드러운 감쇠
  vec2 src = clamp(uv - uDrag*f, 0.0, 1.0);
  vec3 a = over(texture2D(t1, src));
  vec3 b = over(texture2D(t2, src));
  gl_FragColor = vec4(mix(a,b,uMix), 1.0);
}`;

function sh(type, src){ const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s)); return s; }
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs));
gl.linkProgram(prog); gl.useProgram(prog);

const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog,'p');
gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);

const U = n => gl.getUniformLocation(prog,n);
const uCenter=U('uCenter'), uDrag=U('uDrag'), uFall=U('uFall'), uMix=U('uMix');

function makeTex(img, unit){
  const t=gl.createTexture(); gl.activeTexture(gl.TEXTURE0+unit); gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,img);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
}
function load(src){ return new Promise(r=>{ const i=new Image(); i.onload=()=>r(i); i.src=src; }); }

function resize(){
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  const s = Math.min(Math.round(canvas.clientWidth*dpr), 1254);
  canvas.width = canvas.height = s;
  gl.viewport(0,0,s,s);
}
addEventListener('resize', resize);

/* ====== 상태 / 스프링 ====== */
const st = { down:false, grab:{x:0,y:0}, target:{x:0,y:0}, pos:{x:0,y:0}, vel:{x:0,y:0} };

function toUV(e){
  const r = canvas.getBoundingClientRect();
  return { x:(e.clientX-r.left)/r.width, y:(e.clientY-r.top)/r.height };
}
function inCheek(p){ return Math.hypot(p.x-CHEEK.x, p.y-CHEEK.y) < HIT_R; }

canvas.addEventListener('pointerdown', e=>{
  const p = toUV(e);
  if(!inCheek(p)) return;
  st.down = true; st.grab = p; st.target = {x:0,y:0};
  canvas.setPointerCapture(e.pointerId);
  canvas.classList.add('drag');
});
canvas.addEventListener('pointermove', e=>{
  const p = toUV(e);
  if(!st.down){ canvas.classList.toggle('hover', inCheek(p)); return; }
  let dx = p.x-st.grab.x, dy = p.y-st.grab.y;
  const len = Math.hypot(dx,dy);
  if(len > 1e-6){                       // 고무줄처럼 점점 뻑뻑해지게
    const eff = MAX_PULL*Math.tanh(len/MAX_PULL);
    dx *= eff/len; dy *= eff/len;
  }
  st.target = {x:dx, y:dy};
});
function release(){ if(!st.down) return; st.down=false; st.target={x:0,y:0}; canvas.classList.remove('drag'); }
canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', release);

const smooth=(a,b,x)=>{ const t=Math.min(1,Math.max(0,(x-a)/(b-a))); return t*t*(3-2*t); };

let last = performance.now();
let mixV = 0;
function frame(now){
  const dt = Math.min(0.033, (now-last)/1000); last = now;
  // 잡고 있을 땐 단단하게 따라오고, 놓으면 통통 튕기며 원래대로
  const k = st.down ? 420 : 200;
  const c = st.down ? 30  : 8;
  for(const a of ['x','y']){
    const acc = k*(st.target[a]-st.pos[a]) - c*st.vel[a];
    st.vel[a] += acc*dt; st.pos[a] += st.vel[a]*dt;
  }
  const mag = Math.hypot(st.pos.x, st.pos.y);
  // 표정은 당긴 거리에 바로 묶지 않고, 시간에 따라 부드럽게 크로스페이드
  const want = (st.down && mag > 0.012) ? 1 : 0;
  mixV += (want - mixV) * (1 - Math.exp(-dt * (want ? 9 : 6)));
  const mix = smooth(0, 1, mixV);

  gl.uniform2f(uCenter, st.grab.x+st.pos.x, st.grab.y+st.pos.y);
  gl.uniform2f(uDrag, st.pos.x, st.pos.y);
  gl.uniform1f(uFall, FALLOFF);
  gl.uniform1f(uMix, mix);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  requestAnimationFrame(frame);
}

Promise.all([load(IMG1), load(IMG2)]).then(([a,b])=>{
  makeTex(a,0); makeTex(b,1);
  gl.uniform1i(U('t1'),0); gl.uniform1i(U('t2'),1);
  resize(); requestAnimationFrame(frame);
});
</script>
</body>
</html>
